<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>TRAILS-Agents architecture: how a trajectory flows through the system</title>
  <desc>A left-to-right pipeline: agent runtimes emit OpenTelemetry traces, which are ingested and normalized into an event log, frozen into a controlled stimulus, reviewed by a human (the differentiated core, with an AI judge triaging steps), and exported as tidy data and an oversight artifact. Benchmark runs can also feed the ingest stage. Three control modes are shown: post-hoc replay (supported), checkpoint/gating (preview), live monitor (planned).</desc>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <text x="30" y="42" font-size="20" font-weight="500" fill="#1f1e1b">TRAILS-Agents — how a trajectory flows through the system</text>
  <text x="30" y="66" font-size="13" fill="#6b6a63">Borrow the commodity layers (grey/blue). Build the differentiated core (teal).</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a988f"/>
    </marker>
  </defs>

  <!-- Stage 1: Sources -->
  <rect x="25" y="200" width="150" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="100" y="228" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">Agent runtimes</text>
  <text x="100" y="247" font-size="11" text-anchor="middle" fill="#5F5E5A">emit OTel GenAI traces</text>
  <text x="100" y="267" font-size="10.5" text-anchor="middle" fill="#5F5E5A">LangGraph · CrewAI</text>
  <text x="100" y="282" font-size="10.5" text-anchor="middle" fill="#5F5E5A">OpenAI SDK · AutoGen</text>

  <!-- Stage 2: Ingest -->
  <rect x="205" y="200" width="150" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="280" y="232" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Ingest + normalize</text>
  <text x="280" y="252" font-size="11" text-anchor="middle" fill="#185FA5">trace → event log</text>
  <text x="280" y="268" font-size="11" text-anchor="middle" fill="#185FA5">(runtime-agnostic)</text>

  <!-- Stage 3: Freeze -->
  <rect x="385" y="200" width="150" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="460" y="232" font-size="14" font-weight="500" text-anchor="middle" fill="#26215C">Freeze</text>
  <text x="460" y="252" font-size="11" text-anchor="middle" fill="#534AB7">controlled stimulus</text>
  <text x="460" y="268" font-size="11" text-anchor="middle" fill="#534AB7">same flow → N reviewers</text>

  <!-- Stage 4: Human review (CORE) -->
  <rect x="565" y="182" width="150" height="126" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.5"/>
  <text x="640" y="212" font-size="11" text-anchor="middle" fill="#0F6E56">◆ differentiated core</text>
  <text x="640" y="234" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Human review</text>
  <text x="640" y="255" font-size="11" text-anchor="middle" fill="#0F6E56">step · node · span</text>
  <text x="640" y="270" font-size="11" text-anchor="middle" fill="#0F6E56">· trajectory judgment</text>
  <text x="640" y="292" font-size="10.5" text-anchor="middle" fill="#0F6E56">multi-rater · provenance</text>

  <!-- Stage 5: Export -->
  <rect x="745" y="200" width="150" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="820" y="228" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Export</text>
  <text x="820" y="248" font-size="11" text-anchor="middle" fill="#185FA5">tidy CSV / JSON</text>
  <text x="820" y="264" font-size="11" text-anchor="middle" fill="#185FA5">+ oversight artifact</text>
  <text x="820" y="280" font-size="10.5" text-anchor="middle" fill="#185FA5">(Art. 12 record)</text>

  <!-- Pipeline arrows -->
  <line x1="177" y1="245" x2="203" y2="245" stroke="#9a988f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="357" y1="245" x2="383" y2="245" stroke="#9a988f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="537" y1="245" x2="563" y2="245" stroke="#9a988f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="717" y1="245" x2="743" y2="245" stroke="#9a988f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Judge box above core -->
  <rect x="565" y="82" width="150" height="66" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="640" y="110" font-size="13" font-weight="500" text-anchor="middle" fill="#633806">AI judge — triage</text>
  <text x="640" y="129" font-size="10.5" text-anchor="middle" fill="#854F0B">pre-flags steps, never decides</text>
  <line x1="640" y1="148" x2="640" y2="180" stroke="#9a988f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Benchmark import feeding ingest -->
  <rect x="205" y="372" width="150" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="280" y="399" font-size="13" font-weight="500" text-anchor="middle" fill="#2C2C2A">Benchmark run</text>
  <text x="280" y="418" font-size="10.5" text-anchor="middle" fill="#5F5E5A">Inspect / ATBench — import</text>
  <line x1="280" y1="372" x2="280" y2="292" stroke="#9a988f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modes band -->
  <line x1="25" y1="474" x2="895" y2="474" stroke="#e6e3da" stroke-width="1"/>
  <text x="25" y="504" font-size="13" font-weight="500" fill="#1f1e1b">Where the human sits (control mode):</text>

  <rect x="25" y="522" width="240" height="46" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="45" y="543" font-size="13" font-weight="500" fill="#085041">Post-hoc replay</text>
  <text x="45" y="559" font-size="10.5" fill="#0F6E56">supported · build first</text>

  <rect x="285" y="522" width="240" height="46" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="305" y="543" font-size="13" font-weight="500" fill="#633806">Checkpoint / gating</text>
  <text x="305" y="559" font-size="10.5" fill="#854F0B">preview · intervene, interrupt, stop</text>

  <rect x="545" y="522" width="240" height="46" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="565" y="543" font-size="13" font-weight="500" fill="#2C2C2A">Live monitor</text>
  <text x="565" y="559" font-size="10.5" fill="#5F5E5A">planned</text>
</svg>
